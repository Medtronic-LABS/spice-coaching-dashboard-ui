# Production-style static build served by nginx.
# Create `.env` from `.env.example` locally; CI creates `.env` during the test/build pipeline.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://agent-qa.beehyv.com/medtronics-api}
        VITE_COACHING_SUITE_ACCESS: ${VITE_COACHING_SUITE_ACCESS:-coaching}
        VITE_ROUTE_PREFIX: ${VITE_ROUTE_PREFIX:-/ai-coaching}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
