# Production-style static build served by nginx.
# Create `.env` from `.env.example` locally; CI creates `.env` during the test/build pipeline.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://agent-qa.beehyv.com/medtronics-api}
        VITE_ROUTE_PREFIX: ${VITE_ROUTE_PREFIX:-/ai-coaching}
        VITE_DEPLOYMENT_PRIMARY_LOCALE: ${VITE_DEPLOYMENT_PRIMARY_LOCALE:-bn}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_USE_MOCK_MODULE_PIPELINE: ${VITE_USE_MOCK_MODULE_PIPELINE:-false}
        VITE_SPICE_API_BASE_URL: ${VITE_SPICE_API_BASE_URL:-https://spice-dev-backend.uhis.labsplatform.com}
        VITE_SPICE_WEB_LOGIN_URL: ${VITE_SPICE_WEB_LOGIN_URL:-https://spice-dev.uhis.labsplatform.com/}
        VITE_COACHING_SUITE_ACCESS: ${VITE_COACHING_SUITE_ACCESS:-coaching}
        VITE_SPICE_ADMIN_API_URL: ${VITE_SPICE_ADMIN_API_URL:-/admin-service}
        VITE_SPICE_USER_API_URL: ${VITE_SPICE_USER_API_URL:-/user-service}
        VITE_ERROR_REPORTING_URL: ${VITE_ERROR_REPORTING_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
