# Production-style static build served by nginx.
# Create `.env` from `.env.example` locally; CI creates `.env` during the test/build pipeline.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
        VITE_ERROR_REPORTING_URL: ${VITE_ERROR_REPORTING_URL:-}
        VITE_DEPLOYMENT_PRIMARY_LOCALE: ${VITE_DEPLOYMENT_PRIMARY_LOCALE:-bn}
        VITE_SPICE_WEB_LOGIN_URL: ${VITE_SPICE_WEB_LOGIN_URL:?Set VITE_SPICE_WEB_LOGIN_URL in .env}
        VITE_SPICE_ADMIN_API_URL: ${VITE_SPICE_ADMIN_API_URL:-/admin-service}
        VITE_SPICE_USER_API_URL: ${VITE_SPICE_USER_API_URL:-/user-service}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
