server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Generated from nginx/default.conf.template for the default VITE_ROUTE_PREFIX.
    # Docker builds render the template with the configured prefix at image build time.

    location = / {
        return 302 /ai-coaching/;
    }

    location = /ai-coaching {
        return 301 /ai-coaching/$is_args$args;
    }

    location /ai-coaching/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ai-coaching/index.html;
    }
}
