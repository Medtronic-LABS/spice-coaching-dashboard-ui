# Vite dev server with bind mount; open http://<vm-ip>:5173 from your machine.
# Uses `.env` from the project root (created from `.env.example` on first `npm run dev`).
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

volumes:
  dev_node_modules:
